<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>Contate-nos</title>
</head>
</head>
<body>
    <header>
        <div class="title-header">
            <h1>SALVADOR</h1>
            <h2 class="sub-title">BAHIA</h2>
        </div>
        <nav id="navegacao">
            <a href="index.html">Home</a>
            <a href="pontos_turisticos.html">Pontos Turísticos</a>
            <a href="gastronomia.html">Gastronomia</a>
            <a href="eventos.html">Eventos</a>
            <a href="contatos.html">Contato</a>
        </nav>
    </header>

    <section id="fale-conosco">
        <h3>Fale Conosco</h3>
        <p>Preencha os campos abaixo para entrar em contato com a nossa equipe.</p>

        <form action="#" method="POST">

            <div class="campo-form2">
                <label for="nome">Seu Nome:*</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>
            <br>
            <div class="campo-form2">
                <label for="telefone">Seu Telefone:*</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00)9000-0000" required>
            </div>
            <br>
            <div class="campo-form2">
                <label for="endereco">Seu Endereço:*</label>
                <input type="text" id="endereco" name="endereco" placeholder="Rua, Número, Bairro, Cidade, Estado" required>
            </div>
            <br>
            <div class="campo-form2">
                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto" placeholder="Informe o motivo do contato:">
            </div>
            <br>
            <div class="campo-form2">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem aqui..."></textarea>
            </div>
            
            <button type="submit">Enviar Mensagem</button>
        </form>
    </section>
</body>
</html>
