<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisitaSalvador - Teste</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>VisitaSalvador</h1>
    </header>

    <main>
        <div class="row">
            <div class="card">
                <img src="./resources/img/pelourinho.jpg" alt="pelourinho" width="250" height="200">
                <h3>Pelourinho</h3>
                <p>Centro histórico de Salvador, patrimônio mundial da UNESCO.</p>
            </div>
    
            <div class="card">
                <img src="./resources/img/farol da barra.jpg" alt="farol_da_barra" width="250" height="200">
                <h3>Farol da Barra</h3>
                <p>Cartão postal de Salvador com vista incrível para o mar.</p>
            </div>
    
            <div class="card">
                <img src="./resources/img/mercado modelo.jpg" alt="mercado_modelo" width="250" height="200">
                <h3>Mercado Modelo</h3>
                <p>Principal centro de artesanato e cultura popular da cidade.</p>
            </div>
        </div>
    </main>

    <footer>
        <p>VisitaSalvador © 2026</p>
    </footer>

</body>
</html>
